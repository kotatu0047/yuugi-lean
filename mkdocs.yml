# ドキュメントの Web サイト（GitHub Pages）。入力は tools/docs-site.py が _docs_site/ に集める
site_name: yuugi-lean ドキュメント
site_description: 遊戯王 OCG のルールの形式化と、検証付きカードゲームジェネレーター
repo_url: https://github.com/kotatu0047/yuugi-lean
repo_name: kotatu0047/yuugi-lean
docs_dir: _docs_site
site_dir: _site
theme:
  name: material
  language: ja
  features:
    - navigation.sections
    - navigation.top
    - search.highlight
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle: { icon: material/brightness-7, name: ダークモードにする }
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle: { icon: material/brightness-4, name: ライトモードにする }
plugins:
  - search:
      lang: ja
markdown_extensions:
  - tables
  - toc:
      permalink: true
  - admonition
  - pymdownx.highlight
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
nav:
  - トップ: index.md
  - 企画書: 企画書.md
  - アーキテクチャ: アーキテクチャ.md
  - 中間表現: 中間表現.md
  - 証明のジョブ: ジョブ.md
  - C# の実装: csharp.md
  - Unity のエディタ: unity.md
  - 4すくみ考察: 4すくみ考察.md
  - 会話記録: 会話記録.md
