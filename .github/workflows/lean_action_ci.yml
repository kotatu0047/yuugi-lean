name: Lean Action CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: leanprover/lean-action@v1
      # 証明のゲート：凍結した主張（spec/）との一致・公理・禁止した書き方・leanchecker・証明ジョブの再検査
      - name: 証明のゲート
        run: spec/check.sh
