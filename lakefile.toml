name = "YuugiLean"
version = "0.1.0"
defaultTargets = ["CardGen", "cardgen", "Spec"]

[[lean_lib]]
name = "YuugiLean"

[[lean_exe]]
name = "yuugilean"
root = "Main"

[[lean_lib]]
name = "CardGen"

[[lean_exe]]
name = "cardgen"
root = "CardGen.Cli"

# 凍結した主張と、その検査（spec/。人がレビューする。spec/check.sh から）
[[lean_lib]]
name = "Spec"
srcDir = "spec"
globs = ["Spec.+"]
